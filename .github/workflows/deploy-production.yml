name: Deploy Admin Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-deploy-production
  cancel-in-progress: true

env:
  DEPLOY_HOST: 187.127.109.86
  DEPLOY_PORT: 22
  DEPLOY_USER: root
  DEPLOY_PATH: /home/admin_ayocuci/app
  DOMAIN: admin.ayocuci.id
  NEXT_PUBLIC_API_URL: https://api.ayocuci.id/api/v1
  CONTAINER_NAME: AyoCuci-Admin-Web

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        continue-on-error: true
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euxo pipefail
          if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
            echo "SSH_PRIVATE_KEY secret is empty"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keygen -lf ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify SSH connection
        run: |
          set -euxo pipefail
          ssh -p "$DEPLOY_PORT" -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && echo connected && whoami && test -w '$DEPLOY_PATH'"

      - name: Sync project to server
        run: |
          set -euxo pipefail
          rsync -az \
            --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.DS_Store' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild and restart admin web
        run: |
          set -euxo pipefail
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" <<EOF
            set -euxo pipefail
            mkdir -p '$DEPLOY_PATH'
            docker network inspect admin-network >/dev/null 2>&1 || docker network create admin-network
            cat > '$DEPLOY_PATH/.env' <<'ENVEOF'
            DOMAIN=$DOMAIN
            NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
            CONTAINER_NAME=$CONTAINER_NAME
ENVEOF
            cd '$DEPLOY_PATH'
            docker compose -p ayocuci_admin_web build --no-cache
            docker compose -p ayocuci_admin_web up -d --remove-orphans
            docker compose -p ayocuci_admin_web ps
EOF
